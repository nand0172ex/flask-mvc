{% extends 'layouts/base.html' %}

{% block title %}AWS Pricing{% endblock %}

{% block content %}

<body class="container">

    <h2 class="text-center my-3">AWS Pricing Calculator</h2>

    <div class="row g-3">
        <div class="col-md-4">
            <label for="regionSelect" class="form-label">Select Region:</label>
            <select id="regionSelect" class="form-select" onchange="loadGridData()">
                <option value="us-east-1">US East (N. Virginia)</option>
                <option value="eu-central-1">EU (Frankfurt)</option>
            </select>
        </div>

        <div class="col-md-4">
            <label class="form-label">Add Columns:</label>
            <div class="dropdown">
                <button class="btn btn-outline-primary dropdown-toggle w-100" type="button" id="columnDropdown" data-bs-toggle="dropdown">
                    Select Columns
                </button>
                <ul class="dropdown-menu w-100 p-2" id="columnList">
                    <!-- Columns will be dynamically added here -->
                </ul>
            </div>
        </div>

        <div class="col-md-4 d-flex align-items-end">
            <button class="btn btn-primary me-2" onclick="compareRows()">Compare Selected</button>
            <button class="btn btn-secondary" onclick="clearFilters()">Clear Filters</button>
        </div>
    </div>

    <div id="awsPricingTable" class="mt-4"></div>

 

    <script>
        let table;
        let allColumns = [];
        let defaultColumns = ["instanceType", "vcpu", "memory", "operatingSystem", "price"];
        let availableColumns = [];

        document.addEventListener("DOMContentLoaded", function () {
            table = new Tabulator("#awsPricingTable", {
                layout: "fitColumns",
                pagination: "local",
                paginationSize: 10,
                selectable: true,
                columns: []
            });

            loadGridData();
        });

        function loadGridData() {
            let region = document.getElementById("regionSelect").value;
            let jsonFile = `/static/data/${region}.json`;

            fetch(jsonFile)
                .then(response => response.json())
                .then(data => {
                    if (data.length === 0) {
                        console.error("No data found in JSON.");
                        return;
                    }

                    let firstRow = data[0].product.attributes;
                    allColumns = Object.keys(firstRow);
                    availableColumns = allColumns.filter(col => !defaultColumns.includes(col));

                    let columnList = document.getElementById("columnList");
                    columnList.innerHTML = "";

                    availableColumns.forEach(col => {
                        let listItem = document.createElement("li");
                        listItem.innerHTML = `
                            <input class="form-check-input me-2 columnCheckbox" type="checkbox" value="${col}" onchange="updateColumns()">
                            ${col.replace(/_/g, ' ')}
                        `;
                        listItem.classList.add("dropdown-item");
                        columnList.appendChild(listItem);
                    });

                    updateColumns();
                })
                .catch(error => console.error("Error loading JSON:", error));
        }

        function updateColumns() {
            let selectedColumns = Array.from(document.querySelectorAll(".columnCheckbox:checked")).map(el => el.value);

            let columns = [
                { title: "Instance Type", field: "instanceType", headerFilter: true },
                { title: "vCPU", field: "vcpu", headerFilter: true },
                { title: "Memory (GB)", field: "memory", headerFilter: true },
                { title: "OS", field: "operatingSystem", headerFilter: true },
                { title: "Price Per Hour ($)", field: "price", headerFilter: true }
            ];

            selectedColumns.forEach(col => {
                columns.push({ title: col.replace(/_/g, ' '), field: col, headerFilter: true });
            });

            table.setColumns(columns);

            fetch(`/static/data/${document.getElementById("regionSelect").value}.json`)
                .then(response => response.json())
                .then(data => {
                    let formattedData = data.map(item => {
                        let row = { ...item.product.attributes };
                        row.price = extractPrice(item);
                        return row;
                    });

                    table.setData(formattedData);
                })
                .catch(error => console.error("Error loading JSON:", error));
        }

        function extractPrice(item) {
            try {
                let onDemand = item.terms?.OnDemand;
                if (!onDemand) return "N/A";

                let firstKey = Object.keys(onDemand)[0];
                let priceDimensions = onDemand[firstKey]?.priceDimensions;
                if (!priceDimensions) return "N/A";

                let priceKey = Object.keys(priceDimensions)[0];
                return priceDimensions[priceKey]?.pricePerUnit?.USD || "N/A";
            } catch (error) {
                console.error("Error extracting price:", error);
                return "N/A";
            }
        }

    function compareRows() {
    let selectedRows = table.getSelectedData();
    if (selectedRows.length < 2) {
        alert("Select at least two rows for comparison.");
        return;
    }

    // Remove existing comparison results if any
    let oldComparisonContainer = document.querySelector("#comparisonContainer");
    if (oldComparisonContainer) {
        oldComparisonContainer.remove();
    }

    let comparisonContainer = document.createElement("div");
    comparisonContainer.id = "comparisonContainer"; // Assign an ID for easy removal
    comparisonContainer.classList.add("mt-4");
    comparisonContainer.innerHTML = `<h3>Comparison Results</h3>`;

    let comparisonTable = document.createElement("table");
    comparisonTable.classList.add("table", "table-bordered");

    let columns = table.getColumns().map(col => col.getDefinition().field);
    let headerRow = document.createElement("tr");

    columns.forEach(col => {
        let th = document.createElement("th");
        th.textContent = col.replace(/_/g, ' ');
        headerRow.appendChild(th);
    });

    comparisonTable.appendChild(headerRow);

    selectedRows.forEach(row => {
        let tr = document.createElement("tr");
        columns.forEach(col => {
            let td = document.createElement("td");
            td.textContent = row[col] || "N/A";
            tr.appendChild(td);
        });
        comparisonTable.appendChild(tr);
    });

    comparisonContainer.appendChild(comparisonTable);
    document.body.appendChild(comparisonContainer);
}


        function clearFilters() {
    table.clearHeaderFilter(); // Clear all filters
    table.deselectRow(); // Deselect any selected rows

    // Uncheck all column checkboxes
    document.querySelectorAll(".columnCheckbox").forEach(cb => cb.checked = false);
    updateColumns(); // Reset table columns

    // Remove comparison results if they exist
    let comparisonContainer = document.querySelector("#comparisonContainer");
    if (comparisonContainer) {
        comparisonContainer.remove();
    }
}

    </script>

{% endblock %}
